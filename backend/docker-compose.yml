services:
  postgres:
    image: postgres:16-alpine
    container_name: metria-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: metria
    ports:
      # 5433 on the host to avoid clashing with other local PostgreSQL instances.
      - '5433:5432'
    volumes:
      - metria_pgdata:/var/lib/postgresql/data

volumes:
  metria_pgdata:
